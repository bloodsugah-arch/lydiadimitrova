<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydia Dimitrova — Director, Editor, Creative Coder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Put the downloaded font in the "fonts" folder as Acidic.ttf (or Acidic.otf) */
@font-face{font-family:"Acidic";src:url("fonts/Acidic.ttf") format("truetype"),url("fonts/Acidic.otf") format("opentype");font-display:swap}

:root{
  --pink:#fbd3df;      /* page background */
  --blue:#cfe5fb;      /* video tiles + contact band */
  --ink:#232748;       /* text */
  --muted:#4f5478;    /* secondary text */
  --line:#e58bab;      /* underline accent */
  --display:"Acidic","Fraunces",Georgia,serif;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter Tight",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--pink);color:var(--ink);font-family:var(--sans);scroll-behavior:smooth}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

header{display:flex;justify-content:flex-end;padding:28px clamp(20px,4vw,56px)}
header a{text-decoration:none;font-size:16px;font-weight:500;border-bottom:2px solid var(--line);padding-bottom:2px}

.hero{text-align:center;padding:5vh clamp(20px,4vw,56px) 11vh}
.hero h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,9vw,140px);line-height:1;letter-spacing:.01em}
.hero p{margin:28px auto 0;max-width:34ch;color:var(--muted);font-family:var(--serif);font-size:clamp(19px,2vw,26px);line-height:1.4}

.section-title{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.4vw,46px);text-align:center;margin-bottom:28px;letter-spacing:-.01em}

/* Video grid: each tile is half the screen wide */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tile{position:relative;aspect-ratio:16/9;background:var(--blue);overflow:hidden;cursor:pointer;border:0;padding:0;color:#fff;text-align:left;font:inherit}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.tile:hover video,.tile:focus-visible video,.tile.playing video{transform:scale(1.03)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:56px clamp(16px,2vw,32px) clamp(16px,2vw,28px);background:linear-gradient(transparent,rgba(35,39,72,.85))}
.tile h2{font-family:var(--serif);font-weight:500;font-size:clamp(20px,2.2vw,32px)}
.tile span{display:block;margin-top:4px;font-size:15px;color:#fff}

/* Lightbox */
dialog{border:0;background:transparent;padding:0;width:min(1200px,94vw);max-width:none;margin:auto;color:#fff}
dialog::backdrop{background:rgba(35,39,72,.92)}
dialog video{width:100%;display:block;background:#000}
dialog .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--serif);font-size:20px}
dialog button{background:var(--pink);border:0;color:var(--ink);padding:9px 18px;border-radius:999px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}

/* Contact */
.contact{background:var(--blue);text-align:center;margin-top:12vh;padding:12vh clamp(20px,4vw,56px)}
.contact h2{font-family:var(--serif);font-weight:300;font-size:clamp(34px,5.5vw,80px);line-height:1.05;letter-spacing:-.02em}
.contact .mail{display:inline-block;margin-top:32px;font-size:clamp(20px,2.6vw,34px);text-decoration:none;border-bottom:3px solid var(--line);padding-bottom:4px;word-break:break-all}
.contact .tel{display:block;margin-top:22px;font-size:clamp(18px,2vw,24px);text-decoration:none}
footer{background:var(--blue);text-align:center;padding:0 20px 32px;color:var(--muted);font-size:14px}

@media (max-width:720px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.tile:hover video{transform:none}}
</style>
</head>
<body>

<header><a href="#contact">Contact</a></header>

<section class="hero">
  <h1>Lydia Dimitrova</h1>
  <p>Director, editor and creative coder. Moving image, VFX and 3D.</p>
</section>

<h2 class="section-title" id="projects">Projects</h2>
<main class="grid" aria-labelledby="projects">
  <!-- Copy a tile for each project. Put your files in the "videos" folder. -->
  <button class="tile" data-src="videos/project-1.mp4" data-title="Project One">
    <video muted loop playsinline preload="metadata" src="videos/project-1.mp4#t=0.5"></video>
    <div class="cap"><h2>Project One</h2><span>Client or category, 2026</span></div>
  </button>
  <button class="tile" data-src="videos/project-2.mp4" data-title="Project Two">
    <video muted loop playsinline preload="metadata" src="videos/project-2.mp4#t=0.5"></video>
    <div class="cap"><h2>Project Two</h2><span>Client or category, 2026</span></div>
  </button>
  <button class="tile" data-src="videos/project-3.mp4" data-title="Project Three">
    <video muted loop playsinline preload="metadata" src="videos/project-3.mp4#t=0.5"></video>
    <div class="cap"><h2>Project Three</h2><span>Client or category, 2025</span></div>
  </button>
  <button class="tile" data-src="videos/project-4.mp4" data-title="Project Four">
    <video muted loop playsinline preload="metadata" src="videos/project-4.mp4#t=0.5"></video>
    <div class="cap"><h2>Project Four</h2><span>Client or category, 2025</span></div>
  </button>
</main>

<section class="contact" id="contact">
  <h2>Let's make something.</h2>
  <a class="mail" href="mailto:dimitrovalydia@yahoo.com">dimitrovalydia@yahoo.com</a>
  <a class="tel" href="tel:+359886976475">+359 886 976 475</a>
</section>
<footer>© 2026 Lydia Dimitrova</footer>

<dialog id="player" aria-label="Video player">
  <div class="bar"><span id="ptitle"></span><button id="close">Close</button></div>
  <video id="pvideo" controls playsinline></video>
</dialog>

<script>
const tiles=[...document.querySelectorAll('.tile')];
const canHover=matchMedia('(hover:hover)').matches;
const play=t=>{t.querySelector('video').play().catch(()=>{});t.classList.add('playing')};
const stop=t=>{const v=t.querySelector('video');v.pause();v.currentTime=.5;t.classList.remove('playing')};

tiles.forEach(t=>{
  if(canHover){
    t.addEventListener('mouseenter',()=>play(t));
    t.addEventListener('mouseleave',()=>stop(t));
    t.addEventListener('focus',()=>play(t));
    t.addEventListener('blur',()=>stop(t));
  } else {
    new IntersectionObserver(([e])=>e.isIntersecting?play(t):stop(t),{threshold:.7}).observe(t);
  }
  t.addEventListener('click',()=>{
    stop(t);
    pvideo.src=t.dataset.src;ptitle.textContent=t.dataset.title;
    player.showModal();pvideo.play().catch(()=>{});
  });
});

const shut=()=>{pvideo.pause();pvideo.removeAttribute('src');pvideo.load();if(player.open)player.close()};
close.addEventListener('click',shut);
player.addEventListener('click',e=>{if(e.target===player)shut()});
</script>
</body>
</html>
